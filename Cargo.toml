# SPDX-License-Identifier: CC0-1.0
# Workspace of the Naturrhythmuszentrum engine: a matrix-based physics calculation engine whose
# quantities carry checked unit descriptors across typed computation boundaries. Packages join the
# member list under crates/, tools/ and prototypes/ as they land. The workspace lint posture holds for every package;
# any necessary lint exception uses expect on the smallest item with its reason.
# Code is licensed AGPL-3.0-only, named here and inherited by every package; data and documentation
# (inputs, datasets, templates and their renders) are CC0-1.0, stated in LICENSE-DOCS at the root.

[workspace]
resolver = "3"
members = ["tools/docgen", "crates/scalar", "crates/matrix", "crates/units", "crates/cas"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
authors = ["Naturrhythmuszentrum"]
repository = "https://github.com/naturrhythmuszentrum/naturrhythmuszentrum"

[workspace.dependencies]
petgraph = "0.8"
num-bigint = { version = "0.4", default-features = false }
num-integer = { version = "0.1", default-features = false }
num-traits = { version = "0.2", default-features = false }
num-rational = { version = "0.4", default-features = false }
num-complex = { version = "0.4", default-features = false }
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
nrz-scalar = { path = "crates/scalar" }
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg"] }
tempfile = "3"

[workspace.lints.rust]
deprecated_safe = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_compatibility = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unused = { level = "deny", priority = -2 }
warnings = { level = "deny", priority = -1 }
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
dbg_macro = { level = "deny", priority = 0 }
exit = { level = "deny", priority = 0 }
missing_docs_in_private_items = { level = "warn", priority = 0 }
print_stderr = { level = "deny", priority = 0 }
print_stdout = { level = "deny", priority = 0 }
todo = { level = "deny", priority = 0 }
unimplemented = { level = "deny", priority = 0 }
unwrap_used = { level = "deny", priority = 0 }

[profile.release]
lto = "thin"
codegen-units = 1

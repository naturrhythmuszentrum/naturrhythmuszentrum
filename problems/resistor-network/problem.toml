[problem]
slug = "resistor-network"
title = "Resistor network by modified nodal analysis"
register = "prob:exemplars:resistor-network"
kind = "problem"
model = """
Resistors are linear, sources are ideal, and all voltages are relative to one ground node. Source current in the voltage-source MNA variable is positive from its positive terminal towards ground. Configuration zero selects the ladder; configuration one selects the bridge and removes the voltage-source unknown.
"""
instance = """
The ladder has nodes 0,1,2,3. A voltage source Vs fixes node 0. R1, R2 and R3 connect 0 to 1, 1 to 2 and 2 to 3. R4, R5 and R6 connect nodes 1,2,3 respectively to ground. Every ladder resistance is 1 ohm.
The bridge variant has top node t, midpoint nodes l and r, and ground at the bottom. R1 connects t to l, R2 connects l to ground, R3 connects t to r, R4 connects r to ground, and R5 connects l to r. A current source injects Is from ground into t. R6 and Vs are inactive in this configuration.
"""

[[parameters]]
name = "configuration"
description = "zero selects the ladder and one selects the bridge"
value = "0"
unit = { display = "1" }
uncertainty = { kind = "none" }

[[parameters]]
name = "R1"
description = "resistance of branch 1"
value = "1"
unit = { display = "ohm", m = 2, kg = 1, s = -3, A = -2 }
uncertainty = { kind = "none" }

[[parameters]]
name = "R2"
description = "resistance of branch 2"
value = "1"
unit = { display = "ohm", m = 2, kg = 1, s = -3, A = -2 }
uncertainty = { kind = "none" }

[[parameters]]
name = "R3"
description = "resistance of branch 3"
value = "1"
unit = { display = "ohm", m = 2, kg = 1, s = -3, A = -2 }
uncertainty = { kind = "none" }

[[parameters]]
name = "R4"
description = "resistance of branch 4"
value = "1"
unit = { display = "ohm", m = 2, kg = 1, s = -3, A = -2 }
uncertainty = { kind = "none" }

[[parameters]]
name = "R5"
description = "resistance of branch 5"
value = "1"
unit = { display = "ohm", m = 2, kg = 1, s = -3, A = -2 }
uncertainty = { kind = "none" }

[[parameters]]
name = "R6"
description = "resistance of the final ladder shunt"
value = "1"
unit = { display = "ohm", m = 2, kg = 1, s = -3, A = -2 }
uncertainty = { kind = "none" }

[[parameters]]
name = "Vs"
description = "ladder source voltage"
value = "1"
unit = { display = "V", m = 2, kg = 1, s = -3, A = -1 }
uncertainty = { kind = "none" }

[[parameters]]
name = "Is"
description = "bridge source current, inactive in the ladder"
value = "0"
unit = { display = "A", A = 1 }
uncertainty = { kind = "none" }

[[observables]]
name = "v0"
description = "ladder source-node voltage"
unit = { display = "V", m = 2, kg = 1, s = -3, A = -1 }
closed_form = "Vs"
value = "1"
value_kind = "exact"
derivation = """
The ladder MNA system is [[G,B],[B^T,D]]*[v,iV]^T=[j,e]^T, with G=[[1,-1,0,0],[-1,3,-1,0],[0,-1,3,-1],[0,0,-1,2]] S, B=[1,0,0,0]^T, D=[0] ohm, j=[0,0,0,0]^T A and e=[Vs] V. G has shape 4 by 4, B has shape 4 by 1, B^T has shape 1 by 4 and D has shape 1 by 1. The voltage vector has four entries in V and iV has one entry in A.
The current equations require [G]=A/V=S and [B]=A/A=1. The voltage equation requires [B^T]=V/V=1 and [D]=V/A=ohm, including when D is zero. This is the quotient-dimension check; the concatenated unknown vector has no single physical dimension. The final equation is v0=Vs=1 V.
"""
second_route = "none"

[[observables]]
name = "v1"
description = "first ladder rung voltage"
unit = { display = "V", m = 2, kg = 1, s = -3, A = -1 }
closed_form = "5 * Vs / 13"
value = "5/13"
value_kind = "exact"
derivation = """
The final nodal equation gives v2=2*v3. The next equation gives v1=3*v2-v3=5*v3. The first interior equation gives v0=3*v1-v2=13*v3. Hence v1=5/13 V.
"""
second_route = "From the far end, the node-2 load is 1||(1+1)=2/3 ohm and the node-1 load is 1||(1+2/3)=5/8 ohm. Voltage division across R1 and this load gives v1=(5/8)/(1+5/8)=5/13 V."

[[observables]]
name = "v2"
description = "second ladder rung voltage"
unit = { display = "V", m = 2, kg = 1, s = -3, A = -1 }
closed_form = "2 * Vs / 13"
value = "2/13"
value_kind = "exact"
derivation = """
The nodal recurrence gives v2=2*v3 and v0=13*v3, so v2=2/13 V.
"""
second_route = "none"

[[observables]]
name = "v3"
description = "third ladder rung voltage"
unit = { display = "V", m = 2, kg = 1, s = -3, A = -1 }
closed_form = "Vs / 13"
value = "1/13"
value_kind = "exact"
derivation = """
Back substitution from the last rung gives v0=13*v3; the imposed source voltage is 1 V.
"""
second_route = "none"

[[observables]]
name = "i_voltage_source"
description = "ladder voltage-source current, positive towards ground"
unit = { display = "A", A = 1 }
closed_form = "-8 * Vs / (13 ohm)"
value = "-8/13"
value_kind = "exact"
derivation = """
Node 0 gives iV=-(v0-v1)/R1=-(1-5/13)=-8/13 A. The series-branch currents towards the far end are 8/13,3/13,1/13 A, and the shunt currents are 5/13,2/13,1/13 A. Each interior node satisfies Kirchhoff's current law.
"""
second_route = "Series and parallel reduction gives input resistance 1+5/8=13/8 ohm. The delivered current is 1/(13/8)=8/13 A, so the stated source-current orientation gives -8/13 A."

[[observables]]
name = "input_resistance"
description = "ladder resistance seen by the voltage source"
unit = { display = "ohm", m = 2, kg = 1, s = -3, A = -2 }
closed_form = "R1 + (R4 || (R2 + (R5 || (R3 + R6))))"
value = "13/8"
value_kind = "exact"
derivation = """
The symbol || denotes parallel combination ab/(a+b). Starting at the last rung gives 1||(1+1)=2/3, then 1||(1+2/3)=5/8, then 1+5/8=13/8 ohm.
"""
second_route = "none"

[[variants]]
name = "unbalanced-current-driven-bridge"
description = "replace the ladder topology by the specified unbalanced bridge"
overrides = { configuration = "1", R1 = "1", R2 = "2", R3 = "3", R4 = "4", R5 = "5", Is = "1", Vs = "0" }
expected = """
The exact node voltages are vt=155/74 V, vl=51/37 V and vr=46/37 V. The source injects exactly 1 A. The bridge MNA system has no voltage-source unknown: G*v=j with G=[[4/3,-1,-1/3],[-1,17/10,-1/5],[-1/3,-1/5,47/60]] S and j=[1,0,0]^T A. Its B block has shape 3 by 0 and its voltage-equation block has zero rows.
Multiplying the midpoint equations by 10 and 60 gives -10*vt+17*vl-2*vr=0 and -20*vt-12*vl+47*vr=0. Elimination gives vr=46*vl/51 and vt=155*vl/102. Total current into ground is vl/2+vr/4=1, giving vl=51/37 and the stated remaining voltages.
The currents t-to-l, l-to-ground, t-to-r, r-to-ground and l-to-r are respectively 53/74,51/74,21/74,23/74 and 1/37 A. These independently satisfy 53/74+21/74=1 and both midpoint current balances. The nonzero cross-branch current establishes that the bridge is unbalanced.
"""

[errors]
bounded = ["representation contributions from rational resistance and voltage imports", "arithmetic and verification contributions in a certified assembled solve"]
estimated = []
excluded = ["resistor tolerance not declared as input uncertainty", "source nonideality", "temperature dependence and parasitic circuit modelling error"]

[stress]
claims = ["dec:vision:homogeneous-numerical-leaves", "rule:vision:heterogeneous-assembly", "rule:vision:verification-locations"]
bites = ["step:nrz:bite-exemplar-register", "step:nrz:bite-units-design", "step:nrz:bite-certified-matrix-core", "step:nrz:bite-physics-core", "step:nrz:bite-accuracy-and-benchmarks"]

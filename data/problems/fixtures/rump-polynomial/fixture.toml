[problem]
slug = "rump-polynomial"
title = "Rump's polynomial"
register = "cex:exemplars:rump-polynomial"
kind = "fixture"
model = "The dimensionless expression is 333.75*b^6+a^2*(11*a^2*b^2-b^6-121*b^4-2)+5.5*b^8+a/(2*b). Its polynomial coefficients are exact rationals: 333.75=1335/4 and 5.5=11/2. The quotient requires b!=0.\nThe measurement convention for naive evaluation is binary32 or binary64, round to nearest even, no fused multiply-add, no extended intermediates and no algebraic rewriting. Each power is formed by repeated multiplication from the base, starting with the first power. Products and sums are evaluated left to right within their precedence level, respecting the displayed parentheses; every elementary operation rounds to the selected format. The feasibility bite records the resulting floating-point outputs. No such output is asserted here.\n"
instance = "Evaluate at a=77617 and b=33096. The exact polynomial part equals -2, while a/(2*b)=77617/66192, leaving a negative exact result. The precision selector is the significand bit count: 24 for binary32 and 53 for binary64.\n"

[[kinds]]
name = "ratio"
type = "ratio"
dimensions = ["0", "0", "0", "0", "0", "0", "0"]

[[parameters]]
name = "a"
description = "first exact coordinate"
value = "77617"
uncertainty = { kind = "none" }
role = "quantity"
descriptor = { dimensions = ["0", "0", "0", "0", "0", "0", "0"], kind = "ratio", measure = { display = "1", scale = "1", offset = "0" }, affine_role = "difference" }
nonzero = false

[[parameters]]

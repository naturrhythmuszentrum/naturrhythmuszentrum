value_kind = "exact"
derivation = "For Kahan, row i sums to s^(i-1)*(1-c*(n-i)), giving the stated order-three right-hand side. For Wilkinson, a row i<n sums to 1-(i-1)+1=3-i, and the final row sums to 1-(n-1)=2-n. Thus both exact right-hand sides have the all-ones solution.\n"
second_route = "none"

[[observables]]
name = "kahan_smallest_singular_value_squared_upper_bound"
description = "exact upper bound on the square of the smallest singular value at order three"
closed_form = "256/(24^2+15^2+25^2)"
value = "128/713"
value_kind = "exact"
derivation = "For v=[24,15,25]^T, exact multiplication gives K*v=[0,0,16]^T. The Rayleigh quotient for K^T*K is 16^2/(24^2+15^2+25^2)=256/1426=128/713. The smallest eigenvalue cannot exceed this quotient. Thus sigma_min(K)<=sqrt(128/713)<1/2, while every unpivoted QR diagonal is at least 16/25>1/2. A diagonal-only rank diagnostic at the stated threshold misses the small singular value.\nFor general n, U^(-1)[i,j]=c*(1+c)^(j-i-1) for i<j, with unit diagonal. The last inverse column therefore gives sigma_min(K_n)<=s^(n-1)/sqrt(1+c^2*sum((1+c)^(2*j),j=0..n-2)). Keeping just its first entry gives the simpler bound sigma_min(K_n)<=16/(3*2^n). This exposes the growing separation from the trailing QR diagonal s^(n-1). Every finite matrix remains exactly nonsingular.\n"
second_route = "The last inverse column is [3/2,15/16,25/16]^T, with squared norm 713/128. Since norm_2(K^(-1)) is at least that column norm, sigma_min(K)^2<=128/713 independently reproduces the bound."
descriptor = { dimensions = ["0", "0", "0", "0", "0", "0", "0"], kind = "ratio", measure = { display = "1", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "256/(24^2+15^2+25^2)" }


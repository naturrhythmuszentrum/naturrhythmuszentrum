[[variants]]
name = "kahan-order3-success"
description = "well-conditioned solve despite the rank-diagnostic example"
overrides = { n_kahan = "3", rank_threshold = "1/2" }
expected = "The exact solution is [1,1,1]. Under the stated binary64 certificate procedure, success at relative budget 1e-6 is expected. The Frobenius norm squared of K is 3, and that of its displayed inverse is 1113/128. Therefore kappa_2(K)<=sqrt(3339/128)<6, so kappa*u is below 7e-16. The rank threshold is a separate diagnostic choice and is not the solve budget.\n"

[[variants]]
name = "kahan-order40-refusal"
description = "large separation between triangular diagonals and the smallest singular value"
overrides = { n_kahan = "40", rank_threshold = "1e-8" }
expected = "The exact solution remains forty ones. The trailing QR diagonal is (4/5)^39, greater than 1e-4, whereas sigma_min is at most 16/(3*2^40), less than 5e-12. A diagonal-only QR diagnostic therefore fails to report a singular value below the threshold 1e-8.\nSince norm_2(K)>=1, the singular-value bound gives kappa_2(K)>=3*2^40/16=206158430208. The resulting conditioning estimate kappa*u is at least about 2.3e-5. Refusal of the relative solve budget 1e-6 is expected under the prescribed half-ulp import policy and absence of recovery. This remains an expectation subject to the actual inverse and residual certificate, not a declaration of exact rank deficiency.\n"

[[variants]]
name = "wilkinson-order54-success"
description = "large growth with an exactly representable all-ones candidate"
overrides = { n_wilkinson = "54" }
expected = "The exact growth factor is 2^53=9007199254740992. Nevertheless, the all-ones candidate is exactly recovered by the specified elimination: the transformed right-hand side is 1+2^(i-1) for i<n and 2^(n-1) in the last row. At n=54 these integers are representable in binary64, and back substitution gives every component exactly one.\nThe inverse has last row entries 2^(-j) for j<n and 2^(-(n-1)) for j=n. For i<n, its row has zeros before column i, entry 1/2 in column i, entries -2^(i-j-1) for i<j<n, and entry -2^(i-n) in the last column. Every absolute row sum and column sum is one. Thus norm_2(W^(-1))<=1 and norm_2(W)<=n, giving kappa_2(W)<=54 and a conditioning estimate kappa*u below 6e-15.\nSuccess under the stated certificate and relative budget 1e-6 is expected. The inverse entries are dyadic, and the independent residual of the exact candidate is zero. Conversion and verification bounds still have to be recorded. The large elimination growth alone is not grounds for refusal.\n"

[[variants]]
name = "wilkinson-order55-refusal"
description = "the transformed right-hand side loses a unit in binary64"
overrides = { n_wilkinson = "55" }
expected = "The exact solution is fifty-five ones and the exact growth factor is 2^54=18014398509481984. At elimination stage 53, the transformed entry in row 54 becomes 2^53+1, which rounds to 2^53 under ties-to-even. The last-row entry at that stage is 2^53-1; adding the rounded row-54 entry produces 2^54-1, which rounds to 2^54. Back substitution therefore gives xhat_54=0 and every other component one.\nThe exact represented-center residual is b-W*xhat=W*e_54, with entries 1 and -1 in rows 54 and 55 and zeros elsewhere. Its norm is sqrt(2), and the actual candidate error has norm one. Any honest enclosing radius is therefore at least one, far above the relative budget 1e-6 for a candidate norm sqrt(54). Refusal is required for this candidate even though kappa_2(W)<=55 and kappa*u is only about 6e-15. This distinguishes a poor candidate caused by growth and rounding from ill-conditioning of the underlying problem.\n"

[errors]
bounded = ["exact elimination growth for the stated tie rule", "singular-value and conditioning bounds derived from exact matrices", "representation arithmetic and verification contributions in successful certificates"]

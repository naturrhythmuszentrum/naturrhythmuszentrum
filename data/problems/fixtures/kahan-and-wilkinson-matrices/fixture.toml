closed_form = "2^(n_wilkinson-1)"
value = "4"
value_kind = "exact"
derivation = "Each pivot before the last is one and every lower multiplier is minus one. Updating the last column doubles its active entries at each elimination stage. The final pivot is 2^(n-1), while the largest original entry magnitude is one. Thus the growth factor is 2^(n-1), equal to four at order three.\n"
second_route = "At order three the successive upper rows are [1,0,1], [0,1,2] and [0,0,4], displaying the same maximum entry four."

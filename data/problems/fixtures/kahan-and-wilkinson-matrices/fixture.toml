[problem]
slug = "kahan-and-wilkinson-matrices"
title = "Kahan and Wilkinson matrices"
register = "ex:exemplars:kahan-and-wilkinson-matrices"
kind = "fixture"
model = "The Kahan matrix is K_n=D*U, where D=diag(1,s,...,s^(n-1)), U has unit diagonal, entries -c above the diagonal and zero entries below it, and c^2+s^2=1. The fixed angle has c=3/5 and s=4/5. Every column has Euclidean norm one, while an unpivoted QR factorisation has Q=I and R=K_n.\nThe Wilkinson construction here is the Gaussian-elimination partial-pivoting growth matrix: diagonal entries are one, entries below the diagonal are minus one, the last column is all ones, and remaining entries are zero. Equal-magnitude pivot candidates are resolved by choosing the smallest row index, so elimination makes no row swaps. This is the growth construction, rather than the symmetric tridiagonal eigenvalue example, because the fixture stresses elimination growth and factorisation choices.\nFor both matrices the exact right-hand side is the matrix times the all-ones vector. Certification uses binary64, round to nearest even, no fused multiply-add, LU with partial pivoting, exact import for binary64-representable entries and half-ulp enclosures only for inexact imports, and no recovery. With q>=norm_2(I-Z*A), use g=norm_2(Z)/(1-q) only if q<1. With validated rho,rA,rB,xnorm, use R=g*(rho+rB+rA*xnorm)/(1-g*rA) only if g*rA<1. Success requires R/norm_2(xhat)<=relative_budget. All outcome predictions remain expectations to be confirmed or corrected by the feasibility bite.\n"
instance = "At order three, K=[[1,-3/5,-3/5],[0,4/5,-12/25],[0,0,16/25]], with right-hand side [-1/5,8/25,16/25]^T. Its inverse is [[1,3/4,3/2],[0,5/4,15/16],[0,0,25/16]].\nAt order three, W=[[1,0,1],[-1,1,1],[-1,-1,1]], with right-hand side [2,1,-1]^T. For general order, the Wilkinson right-hand side is b_i=3-i for i<n and b_n=2-n.\n"


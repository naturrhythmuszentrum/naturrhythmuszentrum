[problem]
slug = "hilbert-matrices"
title = "Hilbert matrices"
register = "ex:exemplars:hilbert-matrices"
kind = "fixture"
model = "The dimensionless Hilbert matrix is H_n[i,j]=1/(i+j-1), with indices starting at one. It is symmetric positive definite. The exact right-hand side is b_i=sum from j=1 to n of 1/(i+j-1), so the exact solution is the all-ones vector. The six entry observables and six inverse-entry observables below specify the upper triangles at order three; symmetry specifies their lower triangles.\nCertification uses binary64, round to nearest even, no fused multiply-add, LU with partial pivoting and no recovery. Exactly representable matrix and right-hand-side entries import without a representation radius; entries binary64 cannot represent receive a half-ulp enclosure. A validated bound q on norm_2(I-Z*A), for an approximate inverse Z, gives g=norm_2(Z)/(1-q) if q<1. With residual bound rho, input bounds rA and rB, and candidate norm bound xnorm, the certified radius is R=g*(rho+rB+rA*xnorm)/(1-g*rA) if g*rA<1. Success requires R/norm_2(xhat)<=relative_budget; otherwise the requested guarantee is refused. Conditioning estimates below predict outcomes and do not replace these checks.\n"
instance = "The base order is three: H_3=[[1,1/2,1/3],[1/2,1/3,1/4],[1/3,1/4,1/5]], b=[11/6,13/12,47/60]^T, and x=[1,1,1]^T. The exact inverse is [[9,-36,30],[-36,192,-180],[30,-180,180]].\n"


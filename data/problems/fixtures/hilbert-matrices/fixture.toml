[[observables]]
name = "inverse3_11"
description = "order-three inverse entry in row 1 column 1"
closed_form = "60*15/100"
value = "9"
value_kind = "exact"
derivation = "Set C=60*H_3=[[60,30,20],[30,20,15],[20,15,12]]. Its adjugate is [[15,-60,50],[-60,320,-300],[50,-300,300]], and its determinant is 60*15+30*(-60)+20*50=100. Therefore H_3^(-1)=60*adj(C)/100, giving the stated entry.\nFor general order, H_n^(-1)[i,j]=(-1)^(i+j)*(i+j-1)*binom(n+i-1,n-j)*binom(n+j-1,n-i)*binom(i+j-2,i-1)^2. This follows by interpolating R(z)=sum_j x_j/(z+j-1) with R(i)=delta(i,k). With D(z)=product_j(z+j-1), the numerator for column k is D(k)*product over l!=k of (z-l)/(k-l); residues at z=1-j give the displayed integer formula.\n"
second_route = "Multiplication of H_3 by the proposed first inverse column [9,-36,30]^T gives [9-18+10,9/2-12+15/2,3-9+6]^T=[1,0,0]^T. Multiplying the other displayed columns likewise gives the remaining identity columns."
descriptor = { dimensions = ["0", "0", "0", "0", "0", "0", "0"], kind = "ratio", measure = { display = "1", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "60*15/100" }


[problem]
slug = "heat-conduction-one-dimensional"
title = "One-dimensional heat conduction"
register = "prob:exemplars:heat-conduction-one-dimensional"
kind = "problem"
model = "A uniform rod has constant conductivity and diffusivity, no internal heat generation and fixed end temperatures. Steady conduction satisfies T''=0. The transient model is T_t=alpha*T_xx. A central second difference uses three interior points with spacing h=L/4. Temperature coordinates are converted to kelvin before assembly.\nThe temperature-scale selector chooses either the kelvin endpoint parameters or their Celsius alternatives. Celsius parameters are alternative coordinates of the same boundary temperatures, not additional uncertain physical inputs. The time-regime selector chooses steady or transient use.\n"
instance = "The rod occupies 0<=x<=1 m. Its ends are at 273.15 K and 373.15 K. Interior nodes are at 1/4,1/2,3/4 m. For the transient variant, the open rod interior is initially uniform at 273.15 K; the boundary values are imposed for positive time, so the initial right-end mismatch is intentional.\n"

[[kinds]]
name = "length"
type = "named"
dimensions = ["1", "0", "0", "0", "0", "0", "0"]

[[kinds]]
name = "conductivity"
type = "named"
dimensions = ["1", "1", "-3", "0", "-1", "0", "0"]

[[kinds]]
name = "diffusivity"
type = "named"
dimensions = ["2", "0", "-1", "0", "0", "0", "0"]

[[kinds]]
name = "temperature"
type = "named"
dimensions = ["0", "0", "0", "0", "1", "0", "0"]

[[kinds]]
name = "angle"
type = "angle"
dimensions = ["0", "0", "0", "0", "0", "0", "0"]

[[kinds]]
name = "ratio"
type = "ratio"
dimensions = ["0", "0", "0", "0", "0", "0", "0"]

[[kinds]]
name = "heat_flux"
type = "named"
dimensions = ["0", "1", "-3", "0", "0", "0", "0"]

[[kinds]]
name = "decay_rate"
type = "named"
dimensions = ["0", "0", "-1", "0", "0", "0", "0"]

[[kinds]]
name = "heat_flux_length"
type = "named"
dimensions = ["1", "1", "-3", "0", "0", "0", "0"]

[[kinds]]
name = "area"
type = "named"
dimensions = ["2", "0", "0", "0", "0", "0", "0"]

[[kind_rules]]
operation = "multiply"
left = "conductivity"
right = "temperature"
result = "heat_flux_length"
reason = "Thermal conductivity times a temperature difference gives flux times length."

[[kind_rules]]
operation = "divide"
left = "heat_flux_length"
right = "length"
result = "heat_flux"
reason = "Divide by rod length in the Fourier heat flux law."

[[kind_rules]]
operation = "power"
base = "length"
exponent = "2"
result = "area"
reason = "Square the declared length in the modal decay or physical formula."

[[kind_rules]]
operation = "divide"
left = "diffusivity"
right = "area"
result = "decay_rate"
reason = "Thermal diffusivity divided by squared length is a modal decay rate."


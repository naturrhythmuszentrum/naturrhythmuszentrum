closed_form = "1"
value = "1"
value_kind = "exact"
derivation = "The final row gives (2-z)*v3=v2. Both factors on the right and left are sqrt(2), so v3=1. The complete shape is [1,sqrt(2),1].\n"
second_route = "none"
descriptor = { dimensions = ["0", "0", "0", "0", "0", "0", "0"], kind = "ratio", measure = { display = "1", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "1" }

[[observables]]

[[variants]]
name = "three-mass-ring"
description = "cyclic coupling with one rigid-body mode and a repeated eigenvalue"
overrides = { boundary = "1" }
expected = "The stiffness is k*[[2,-1,-1],[-1,2,-1],[-1,-1,2]]=k*(3*I-J), where J is the all-ones matrix; the mass matrix remains m*I. The exact squared angular frequencies are 0,3*k/m,3*k/m, hence 0,3,3 s^(-2). The frequencies are 0 and sqrt(3) twice, with sqrt(3)=1.73205080757 rad/s to twelve significant digits.\nA rigid-body shape is [1,1,1]. An orthogonal basis for the repeated eigenspace is [1,-1,0] and [1,1,-2]. The repeated eigenspace is exactly the plane v1+v2+v3=0, with orthogonal projector I-J/3. Correct spectral evidence identifies this invariant subspace; individual basis vectors inside it are not uniquely determined. On that plane J*v=0, so direct multiplication independently gives K*v=3*k*v.\n"

[errors]
bounded = ["representation and arithmetic contributions in validated spectral quantities", "verification residuals for eigenpairs or invariant subspaces"]
estimated = []
excluded = ["spring and mass modelling error", "uniqueness of individual vectors in a repeated eigenspace", "a relative error claim for the zero eigenvalue without an absolute budget"]


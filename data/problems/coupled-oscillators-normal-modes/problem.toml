value_kind = "decimal-12"
derivation = "The first row gives v2=(2-z)*v1. For z=2-sqrt(2) and v1=1, this gives v2=sqrt(2).\n"
second_route = "none"
descriptor = { dimensions = ["0", "0", "0", "0", "0", "0", "0"], kind = "ratio", measure = { display = "1", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "sqrt(2)" }

[[observables]]
name = "mode1_component3"

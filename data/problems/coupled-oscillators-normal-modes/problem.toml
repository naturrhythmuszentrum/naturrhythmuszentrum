[problem]
slug = "coupled-oscillators-normal-modes"
title = "Coupled oscillators and normal modes"
register = "prob:exemplars:coupled-oscillators-normal-modes"
kind = "problem"
model = "Three equal point masses undergo small longitudinal displacements. Springs are linear and massless, with no damping. Mode shapes are dimensionless ratios, with their first component fixed to one for the chain. The ring variant uses cyclic scalar displacement coordinates and three nearest-neighbour springs.\n"
instance = "For the chain, walls are at coordinates 0 and 4*spacing, and masses are at spacing, 2*spacing and 3*spacing. Four equal springs connect successive walls and masses. The base boundary selector is zero. Selector one closes the three masses into a cyclic chain and removes the wall springs.\n"

[[kinds]]
name = "mass"
type = "named"
dimensions = ["0", "1", "0", "0", "0", "0", "0"]

[[kinds]]
name = "stiffness"
type = "named"
dimensions = ["0", "1", "-2", "0", "0", "0", "0"]

[[kinds]]
name = "length"
type = "named"
dimensions = ["1", "0", "0", "0", "0", "0", "0"]

[[kinds]]
name = "frequency_squared"
type = "named"
dimensions = ["0", "0", "-2", "0", "0", "0", "0"]

[[kinds]]
name = "angular_frequency"
type = "named"
dimensions = ["0", "0", "-1", "0", "0", "0", "0"]

[[kinds]]
name = "ratio"
type = "ratio"
dimensions = ["0", "0", "0", "0", "0", "0", "0"]

[[kind_rules]]
operation = "divide"
left = "stiffness"
right = "mass"
result = "frequency_squared"
reason = "Stiffness per inertial mass gives the oscillator frequency squared."

[[kind_rules]]
operation = "power"
base = "frequency_squared"
exponent = "1/2"
result = "angular_frequency"
reason = "The positive oscillator root denotes angular frequency."

[[parameters]]
name = "m"
description = "each mass"
value = "1"
uncertainty = { kind = "none" }
role = "quantity"
descriptor = { dimensions = ["0", "1", "0", "0", "0", "0", "0"], kind = "mass", measure = { display = "kg", scale = "1", offset = "0" }, affine_role = "difference" }
nonzero = false

[[parameters]]
name = "k"
description = "each spring stiffness"
value = "1"
uncertainty = { kind = "none" }
role = "quantity"
descriptor = { dimensions = ["0", "1", "-2", "0", "0", "0", "0"], kind = "stiffness", measure = { display = "N/m", scale = "1", offset = "0" }, affine_role = "difference" }
nonzero = false

[[parameters]]
name = "spacing"
description = "undeformed chain spacing"
value = "1"
uncertainty = { kind = "none" }
role = "quantity"
descriptor = { dimensions = ["1", "0", "0", "0", "0", "0", "0"], kind = "length", measure = { display = "m", scale = "1", offset = "0" }, affine_role = "difference" }
nonzero = false

[[parameters]]
name = "boundary"
description = "zero for fixed-wall chain and one for ring"
value = "0"
uncertainty = { kind = "none" }
role = "metadata"
metadata = { kind = "category", values = ["0", "1"] }

[[observables]]
name = "omega1_squared"
description = "lowest squared angular frequency"
closed_form = "(2 - sqrt(2)) * k / m"
value = "0.585786437627"
value_kind = "decimal-12"
derivation = "The generalised eigenproblem is K*v=lambda*M*v, with K=k*[[2,-1,0],[-1,2,-1],[0,-1,2]] in N/m and M=m*I in kg. Thus lambda has dimension s^(-2), and omega has dimension rad/s. For z=lambda*m/k, the characteristic polynomial is (2-z)*((2-z)^2-2). Its smallest root is 2-sqrt(2).\nThe rational inequalities 1.4142135623730950<sqrt(2)<1.4142135623730951 follow by squaring their endpoints and suffice to round the squared frequencies and middle shape components to twelve significant digits.\n"
second_route = "none"
descriptor = { dimensions = ["0", "0", "-2", "0", "0", "0", "0"], kind = "frequency_squared", measure = { display = "s^-2", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "(2 - sqrt(2)) * k / m" }

[[observables]]
name = "omega2_squared"
description = "middle squared angular frequency"
closed_form = "2 * k / m"
value = "2"
value_kind = "exact"
derivation = "The central root of (2-z)*((2-z)^2-2) is z=2. With k/m=1 s^(-2), the eigenvalue is 2 s^(-2).\n"
second_route = "Direct multiplication gives K*[1,0,-1]^T=2*[1,0,-1]^T N/m, while M is the identity in kg."
descriptor = { dimensions = ["0", "0", "-2", "0", "0", "0", "0"], kind = "frequency_squared", measure = { display = "s^-2", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "2 * k / m" }

[[observables]]
name = "omega3_squared"
description = "highest squared angular frequency"
closed_form = "(2 + sqrt(2)) * k / m"
value = "3.41421356237"
value_kind = "decimal-12"
derivation = "The largest root of the displayed characteristic polynomial is 2+sqrt(2). The stated rational bracket for sqrt(2) gives the recorded decimal.\n"
second_route = "none"
descriptor = { dimensions = ["0", "0", "-2", "0", "0", "0", "0"], kind = "frequency_squared", measure = { display = "s^-2", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "(2 + sqrt(2)) * k / m" }

[[observables]]
name = "omega1"
description = "lowest angular frequency"
closed_form = "sqrt((2 - sqrt(2)) * k / m)"
value = "0.765366864730"
value_kind = "decimal-12"
derivation = "Take the positive square root of the lowest eigenvalue. Squaring rational endpoints, together with the bracket for sqrt(2), gives 0.7653668647301795<omega1<0.7653668647301796 in rad/s.\n"
second_route = "none"
descriptor = { dimensions = ["0", "0", "-1", "0", "0", "0", "0"], kind = "angular_frequency", measure = { display = "rad/s", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "sqrt((2 - sqrt(2)) * k / m)" }

[[observables]]
name = "omega2"
description = "middle angular frequency"
closed_form = "sqrt(2 * k / m)"
value = "1.41421356237"
value_kind = "decimal-12"
derivation = "The positive square root of 2 s^(-2) is sqrt(2) rad/s. The bracket obtained by rational squaring fixes the twelve-digit rounding.\n"
second_route = "none"
descriptor = { dimensions = ["0", "0", "-1", "0", "0", "0", "0"], kind = "angular_frequency", measure = { display = "rad/s", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "sqrt(2 * k / m)" }

[[observables]]
name = "omega3"
description = "highest angular frequency"
closed_form = "sqrt((2 + sqrt(2)) * k / m)"
value = "1.84775906502"
value_kind = "decimal-12"
derivation = "The positive square root of the highest eigenvalue lies between 1.8477590650225734 and 1.8477590650225736 rad/s, as checked by squaring and using the bracket for sqrt(2).\n"
second_route = "none"
descriptor = { dimensions = ["0", "0", "-1", "0", "0", "0", "0"], kind = "angular_frequency", measure = { display = "rad/s", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "sqrt((2 + sqrt(2)) * k / m)" }

[[observables]]
name = "mode1_component1"
description = "first component of the lowest-frequency shape"
closed_form = "1"
value = "1"
value_kind = "exact"
derivation = "The scale convention fixes the first component to one.\n"
second_route = "none"
descriptor = { dimensions = ["0", "0", "0", "0", "0", "0", "0"], kind = "ratio", measure = { display = "1", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "1" }

[[observables]]
name = "mode1_component2"

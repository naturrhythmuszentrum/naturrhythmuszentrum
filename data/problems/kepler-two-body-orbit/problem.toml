[problem]
slug = "kepler-two-body-orbit"
title = "Kepler two-body orbit"
register = "prob:exemplars:kepler-two-body-orbit"
kind = "problem"
model = "A test body moves in the Newtonian inverse-square field of a fixed primary, with gravitational parameter mu=G*M. The test-body limit neglects the primary's recoil. Periapsis radius rp and eccentricity e specify the orbit geometry. The initial speed is derived as sqrt(mu*(1+e)/rp), so changing G changes that speed coherently while keeping the geometric ellipse fixed. The speed is not an independently exact measured input.\nThe reported exact values are nominal mathematical values at the stated central G. G carries a probabilistic standard uncertainty, so these nominal exact values do not assert deterministic enclosure of the physical orbit.\n"
instance = "The primary is at the origin. The test body starts at (rp,0), with velocity (0,sqrt(mu*(1+e)/rp)). The exact primary mass is chosen so that the nominal mu is 1 m^3/s^2. The periapsis radius is 2/5 m and eccentricity is 3/5.\n"

[[kinds]]
name = "gravitational_constant"
type = "named"
dimensions = ["3", "-1", "-2", "0", "0", "0", "0"]

[[kinds]]
name = "standard_gravitational_constant"
type = "uncertainty"
dimensions = ["3", "-1", "-2", "0", "0", "0", "0"]
mode = "standard"
value_kind = "gravitational_constant"

[[kinds]]
name = "mass"
type = "named"
dimensions = ["0", "1", "0", "0", "0", "0", "0"]

[[kinds]]
name = "length"
type = "named"
dimensions = ["1", "0", "0", "0", "0", "0", "0"]

[[kinds]]
name = "ratio"
type = "ratio"
dimensions = ["0", "0", "0", "0", "0", "0", "0"]

[[kinds]]
name = "angle"
type = "angle"
dimensions = ["0", "0", "0", "0", "0", "0", "0"]

[[kinds]]
name = "velocity"
type = "named"
dimensions = ["1", "0", "-1", "0", "0", "0", "0"]

[[kinds]]
name = "duration"
type = "named"
dimensions = ["0", "0", "1", "0", "0", "0", "0"]

[[kinds]]
name = "specific_energy"
type = "named"
dimensions = ["2", "0", "-2", "0", "0", "0", "0"]

[[kinds]]
name = "specific_angular_momentum"
type = "named"
dimensions = ["2", "0", "-1", "0", "0", "0", "0"]

[[kinds]]
name = "relative_standard_duration"
type = "uncertainty"
dimensions = ["0", "0", "0", "0", "0", "0", "0"]
mode = "relative-standard"
value_kind = "duration"

[[kinds]]
name = "gravitational_parameter"
type = "named"
dimensions = ["3", "0", "-2", "0", "0", "0", "0"]

[[kinds]]
name = "volume"
type = "named"
dimensions = ["3", "0", "0", "0", "0", "0", "0"]

[[kinds]]
name = "duration_squared"
type = "named"
dimensions = ["0", "0", "2", "0", "0", "0", "0"]

[[kinds]]
name = "angular_momentum_squared"
type = "named"
dimensions = ["4", "0", "-2", "0", "0", "0", "0"]

[[kinds]]
name = "kepler_invariant_squared"
type = "named"
dimensions = ["6", "0", "-4", "0", "0", "0", "0"]

[[kind_rules]]
operation = "multiply"
left = "gravitational_constant"
right = "mass"
result = "gravitational_parameter"
reason = "Newtonian gravitational constant times central mass is the gravitational parameter."

[[kind_rules]]
operation = "divide"
left = "gravitational_parameter"
right = "length"
result = "specific_energy"
reason = "The gravitational parameter per orbital radius has specific energy meaning."

[[kind_rules]]
operation = "power"
base = "specific_energy"
exponent = "1/2"
result = "velocity"
reason = "The positive orbital speed root of specific energy units."

[[kind_rules]]
operation = "power"
base = "length"
exponent = "3"
result = "volume"
reason = "Cube the semi-major axis in Kepler period scaling."

[[kind_rules]]
operation = "divide"
left = "volume"
right = "gravitational_parameter"
result = "duration_squared"
reason = "Cubed orbital size divided by gravitational parameter gives period squared units."

[[kind_rules]]
operation = "power"
base = "duration_squared"
exponent = "1/2"
result = "duration"
reason = "The positive period root is a duration."

[[kind_rules]]
operation = "multiply"
left = "gravitational_parameter"
right = "length"
result = "angular_momentum_squared"
reason = "Gravitational parameter times semi-major axis enters squared specific angular momentum."

[[kind_rules]]
operation = "power"
base = "angular_momentum_squared"
exponent = "1/2"
result = "specific_angular_momentum"
reason = "The positive orbital invariant root gives specific angular momentum."

[[kind_rules]]
operation = "power"
base = "specific_angular_momentum"
exponent = "2"
result = "angular_momentum_squared"
reason = "Square the specific angular momentum in the eccentricity invariant."

[[kind_rules]]
operation = "multiply"
left = "specific_energy"
right = "angular_momentum_squared"
result = "kepler_invariant_squared"
reason = "The energy-angular-momentum product forms the numerator of the eccentricity invariant."

[[kind_rules]]
operation = "power"
base = "gravitational_parameter"
exponent = "2"
result = "kepler_invariant_squared"
reason = "The squared gravitational parameter normalizes the eccentricity invariant."

[[parameters]]
name = "G"
description = "CODATA 2018 recommended gravitational constant"
value = "6.67430e-11"
uncertainty = { kind = "components", components = [{ name = "sigma_G", class = "measurement", mode = "standard", target = "G", descriptor = { dimensions = ["3", "-1", "-2", "0", "0", "0", "0"], kind = "standard_gravitational_constant", measure = { display = "m^3/(kg*s^2)", scale = "1", offset = "0" }, affine_role = "difference" }, source = "codata-2018", assurance = "Probabilistic standard uncertainty; not a deterministic enclosure", magnitude = { sigma = "1.5e-15" } }] }
role = "quantity"
descriptor = { dimensions = ["3", "-1", "-2", "0", "0", "0", "0"], kind = "gravitational_constant", measure = { display = "m^3/(kg*s^2)", scale = "1", offset = "0" }, affine_role = "difference" }
nonzero = true

[[parameters]]
name = "M"
description = "exact mass of the constructed primary"
value = "1000000000000000/66743"
uncertainty = { kind = "none" }
role = "quantity"
descriptor = { dimensions = ["0", "1", "0", "0", "0", "0", "0"], kind = "mass", measure = { display = "kg", scale = "1", offset = "0" }, affine_role = "difference" }
nonzero = false

[[parameters]]
name = "rp"
description = "periapsis radius"
value = "2/5"
uncertainty = { kind = "none" }
role = "quantity"
descriptor = { dimensions = ["1", "0", "0", "0", "0", "0", "0"], kind = "length", measure = { display = "m", scale = "1", offset = "0" }, affine_role = "difference" }
nonzero = false

[[parameters]]
name = "e"
description = "eccentricity specifying the initial-condition family"
value = "3/5"
uncertainty = { kind = "none" }
role = "quantity"
descriptor = { dimensions = ["0", "0", "0", "0", "0", "0", "0"], kind = "ratio", measure = { display = "1", scale = "1", offset = "0" }, affine_role = "difference" }
nonzero = false

[[symbols]]
name = "radian"
description = "One radian as the explicit angle convention"
descriptor = { dimensions = ["0", "0", "0", "0", "0", "0", "0"], kind = "angle", measure = { display = "rad", scale = "1", offset = "0" }, affine_role = "difference" }
source = "Explicit radian convention for angle-valued inverse trigonometric functions"
assurance = "Exact coordinate convention, independent of every reference answer"
kind = "constant"
value = "1"

[[symbols]]
name = "pi"
description = "Declared helper pi"
descriptor = { dimensions = ["0", "0", "0", "0", "0", "0", "0"], kind = "ratio", measure = { display = "1", scale = "1", offset = "0" }, affine_role = "difference" }
source = "Machin identity; explicit radian convention, independent of reference answers"
assurance = "Algebraic descriptor consistency only; no numerical certification"
kind = "derived"
expression = { kind = "algebra", text = "(16*atan(1/5)-4*atan(1/239))/radian" }

[[observables]]
name = "periapsis_speed"
description = "derived initial transverse speed at the nominal gravitational constant"
closed_form = "sqrt(G*M*(1+e)/rp)"
value = "2"
value_kind = "exact"
derivation = "The nominal G is 66743/1000000000000000 in SI units, so G*M=1 m^3/s^2. The speed squared is (1+3/5)/(2/5)=4 m^2/s^2; its positive square root is exactly 2 m/s.\n"
second_route = "none"
descriptor = { dimensions = ["1", "0", "-1", "0", "0", "0", "0"], kind = "velocity", measure = { display = "m/s", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "sqrt(G*M*(1+e)/rp)" }

[[observables]]
name = "semi_major_axis"
description = "semi-major axis"
closed_form = "rp / (1-e)"
value = "1"
value_kind = "exact"
derivation = "Periapsis satisfies rp=a*(1-e). Therefore a=(2/5)/(2/5)=1 m.\n"
second_route = "none"
descriptor = { dimensions = ["1", "0", "0", "0", "0", "0", "0"], kind = "length", measure = { display = "m", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "rp / (1-e)" }

[[observables]]
name = "period"
description = "nominal orbital period"
closed_form = "2*pi*sqrt((rp/(1-e))^3/(G*M))"
value = "6.28318530718"
value_kind = "decimal-12"
derivation = "Kepler's period formula gives T=2*pi*sqrt(a^3/mu)=2*pi s. A reproducible rational evaluation uses pi=16*atan(1/5)-4*atan(1/239), with atan(z)=sum from j=0 to N of (-1)^j*z^(2*j+1)/(2*j+1) and the next term bounding the truncation. Taking N=20 for 1/5 and N=6 for 1/239 gives more than the precision needed for the displayed twelve-digit result.\n"
second_route = "The semi-minor axis is a*sqrt(1-e^2)=4/5 m. Ellipse area pi*a*b divided by areal speed h/2=(4/5)/2 gives T=2*pi s."
descriptor = { dimensions = ["0", "0", "1", "0", "0", "0", "0"], kind = "duration", measure = { display = "s", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "2*pi*sqrt((rp/(1-e))^3/(G*M))" }

[[observables]]
name = "specific_energy"
description = "specific mechanical energy"
closed_form = "-G*M/(2*(rp/(1-e)))"
value = "-1/2"
value_kind = "exact"
derivation = "For an ellipse, the conserved specific energy is -mu/(2*a). With mu=1 and a=1, this is -1/2 J/kg.\n"
second_route = "At periapsis, v^2/2-mu/rp=4/2-1/(2/5)=2-5/2=-1/2 J/kg."
descriptor = { dimensions = ["2", "0", "-2", "0", "0", "0", "0"], kind = "specific_energy", measure = { display = "J/kg", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "-G*M/(2*(rp/(1-e)))" }

[[observables]]
name = "specific_angular_momentum"
description = "positive out-of-plane specific angular momentum"
closed_form = "sqrt(G*M*(rp/(1-e))*(1-e^2))"
value = "4/5"
value_kind = "exact"
derivation = "The squared specific angular momentum is mu*a*(1-e^2)=1-9/25=16/25 m^4/s^2. The chosen counterclockwise motion gives the positive root, 4/5 m^2/s.\n"
second_route = "The perpendicular initial radius and velocity give h=rp*vp=(2/5)*2=4/5 m^2/s."
descriptor = { dimensions = ["2", "0", "-1", "0", "0", "0", "0"], kind = "specific_angular_momentum", measure = { display = "m^2/s", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "sqrt(G*M*(rp/(1-e))*(1-e^2))" }

[[observables]]
name = "eccentricity"
description = "eccentricity reconstructed from the conserved quantities"
closed_form = "sqrt(1 + 2*specific_energy*specific_angular_momentum^2/(G*M)^2)"
value = "3/5"
value_kind = "exact"
derivation = "Substitution gives e^2=1+2*(-1/2)*(16/25)=9/25, so e=3/5. At the chosen periapsis the eccentricity vector is (3/5,0).\n"
second_route = "none"
descriptor = { dimensions = ["0", "0", "0", "0", "0", "0", "0"], kind = "ratio", measure = { display = "1", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "sqrt(1 + 2*specific_energy*specific_angular_momentum^2/(G*M)^2)" }

[[observables]]
name = "radius_quarter_turn"
description = "radius at true anomaly pi/2"
closed_form = "(rp/(1-e))*(1-e^2)"
value = "16/25"
value_kind = "exact"
derivation = "The polar ellipse is r(f)=a*(1-e^2)/(1+e*cos(f)). At f=pi/2 the cosine vanishes, so r=16/25 m.\n"
second_route = "none"
descriptor = { dimensions = ["1", "0", "0", "0", "0", "0", "0"], kind = "length", measure = { display = "m", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "(rp/(1-e))*(1-e^2)" }

[[observables]]
name = "radius_half_turn"
description = "apoapsis radius at true anomaly pi"
closed_form = "(rp/(1-e))*(1+e)"
value = "8/5"
value_kind = "exact"
derivation = "At f=pi the polar denominator is 1-e, leaving a*(1+e)=8/5 m.\n"
second_route = "none"
descriptor = { dimensions = ["1", "0", "0", "0", "0", "0", "0"], kind = "length", measure = { display = "m", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "(rp/(1-e))*(1+e)" }

[[observables]]
name = "relative_period_standard_uncertainty"
description = "first-order relative standard uncertainty of period at fixed orbital geometry"
closed_form = "sigma_G/(2*G)"
value = "3/266972"
value_kind = "exact"
derivation = "With a and M fixed, logarithmic differentiation of T=2*pi*a^(3/2)*(G*M)^(-1/2) gives dT/T=-(1/2)*dG/G. Thus u(T)/T=u(G)/(2*G). The supplied standard uncertainty gives (1.5e-15)/(2*6.67430e-11)=3/266972 exactly as a first-order propagation coefficient. This is a probabilistic linearisation result, not a deterministic radius.\n"
second_route = "none"
descriptor = { dimensions = ["0", "0", "0", "0", "0", "0", "0"], kind = "relative_standard_duration", measure = { display = "1", scale = "1", offset = "0" }, affine_role = "difference" }
companion = { class = "measurement", mode = "relative-standard", target = "period", reference = "period", source = "observables.relative_period_standard_uncertainty.derivation", assurance = "Preserved first-order probabilistic linearisation; relationship and descriptor unadmitted" }
expression = { kind = "unsupported", text = "sigma_G/(2*G)", code = "unavailable-relative-period-relationship", reason = "The compound divisor 2*G carries no named nonzero reference. Rewriting as (sigma_G/G)/2 would establish a relationship to G, not period. Binding the relative output to period requires propagated relative relationship evidence and nonzero evidence for the derived period, which the current checker cannot supply.", dependencies = ["sigma_G", "G", "period"], scope = ["expression", "relationship", "descriptor"] }

[[variants]]
name = "long-run-conservation"
description = "compare a many-orbit trajectory with the exact ellipse and conserved quantities"
overrides = { e = "3/5" }
expected = "At the nominal inputs, every completed orbital period returns the state to (2/5,0) m and (0,2) m/s. Energy remains -1/2 J/kg and specific angular momentum remains 4/5 m^2/s. Radius is 16/25 m at quarter-turn true anomaly and 8/5 m at half-turn true anomaly.\nAn integration experiment records observable budgets, time-stepping error and arithmetic contributions separately, and reports measured long-run drift against these constants. True anomaly is a geometric angle and is not assumed proportional to elapsed time. The probabilistic uncertainty in G does not provide the deterministic input enclosure required for a strict physical-value certificate.\n"

[errors]
bounded = ["arithmetic and verification contributions conditional on fixed nominal inputs and a validated implementation"]
estimated = ["probabilistic-only linear propagation of the gravitational constant uncertainty", "measured integration drift"]
excluded = ["deterministic physical-input enclosure from a standard uncertainty", "test-body and Newtonian modelling error", "unproved time-discretisation bounds"]

[stress]
claims = ["rule:vision:local-and-observable-budgets", "def:vision:error-companion-surface", "rule:vision:imports-and-exactness"]
bites = ["step:nrz:bite-exemplar-register", "step:nrz:bite-accuracy-and-benchmarks"]

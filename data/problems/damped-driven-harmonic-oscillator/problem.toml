[[kind_rules]]
operation = "power"
base = "angular_frequency"
exponent = "2"
result = "frequency_squared"
reason = "Square the declared angular frequency in the oscillator equation."

[[kind_rules]]
operation = "multiply"
left = "mass"
right = "frequency_squared"
result = "stiffness"
reason = "The inertial contribution to harmonic dynamic stiffness."

[[kind_rules]]
operation = "power"
base = "stiffness"
exponent = "2"
result = "stiffness_squared"
reason = "Square the dynamic or static stiffness for the denominator or determinant."

[[kind_rules]]
operation = "multiply"
left = "damping"
right = "angular_frequency"
result = "stiffness"
reason = "The phase-quadrature damping contribution to harmonic dynamic stiffness."

[[kind_rules]]
operation = "multiply"
left = "force"
right = "stiffness"
result = "force_stiffness"
reason = "The amplitude numerator or elimination numerator is force times stiffness."

[[kind_rules]]
operation = "divide"
left = "force_stiffness"
right = "stiffness_squared"
result = "length"
reason = "Divide the displacement numerator by the stiffness determinant."

[[kind_rules]]
operation = "divide"
left = "damping"
right = "mass"
result = "decay_rate"
reason = "Damping per inertial mass gives a decay rate."

[[kind_rules]]
operation = "divide"
left = "stiffness"
right = "mass"
result = "frequency_squared"
reason = "Stiffness per inertial mass gives the oscillator frequency squared."

[[kind_rules]]
operation = "power"
base = "decay_rate"
exponent = "2"
result = "frequency_squared"
reason = "The squared damping rate enters the oscillator frequency discriminant."

[[kind_rules]]
operation = "power"
base = "frequency_squared"
exponent = "1/2"
result = "angular_frequency"
reason = "The positive oscillator root denotes angular frequency."

[[kind_rules]]
operation = "divide"
left = "angular_frequency"
right = "angle"
result = "decay_rate"
reason = "Divide by the explicit radian convention to obtain the derivative rate."

[[kind_rules]]
operation = "multiply"
left = "length"
right = "decay_rate"
result = "velocity"
reason = "A displacement coefficient times a derivative rate is velocity."

[[kind_rules]]
operation = "multiply"
left = "decay_rate"
right = "length"
result = "velocity"
reason = "The decay derivative multiplies a displacement coefficient."

[[kind_rules]]
operation = "divide"
left = "velocity"
right = "decay_rate"
result = "length"
reason = "A velocity coefficient divided by its derivative rate gives displacement."

[[kind_rules]]
operation = "power"
base = "stiffness_squared"
exponent = "1/2"
result = "stiffness"
reason = "Recover stiffness magnitude from its positive squared magnitude."

[[kind_rules]]
operation = "divide"
left = "force"
right = "stiffness"
result = "length"
reason = "Elastic force divided by stiffness gives displacement."

[[kind_rules]]
operation = "multiply"
left = "angular_frequency"
right = "duration"
result = "angle"
reason = "Angular frequency integrated over a duration gives a phase angle."

[[kind_rules]]
operation = "multiply"
left = "decay_rate"
right = "duration"
result = "ratio"
reason = "A decay rate times duration is the dimensionless exponential argument."


[problem]
slug = "damped-driven-harmonic-oscillator"
title = "Damped driven harmonic oscillator"
register = "prob:exemplars:damped-driven-harmonic-oscillator"
kind = "problem"
model = "The displacement satisfies m*x''+c*x'+k*x=F*cos(omega*t). The spring and viscous damper are linear, the drive is prescribed, and the initial displacement and velocity vanish. Phase lag is measured relative to the cosine drive and lies between zero and pi for positive damping.\n"
instance = "A 4 kg mass is attached to a spring of stiffness 13 N/m and a damper of coefficient 12 N*s/m. A 15 N cosine force with angular frequency 1 rad/s starts at time zero. The transient displacement is requested at t=1 s.\n"

[[kinds]]
name = "mass"
type = "named"
dimensions = ["0", "1", "0", "0", "0", "0", "0"]

[[kinds]]
name = "stiffness"
type = "named"
dimensions = ["0", "1", "-2", "0", "0", "0", "0"]

[[kinds]]
name = "damping"
type = "named"
dimensions = ["0", "1", "-1", "0", "0", "0", "0"]

[[kinds]]

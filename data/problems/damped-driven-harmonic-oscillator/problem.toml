type = "named"
dimensions = ["1", "1", "-2", "0", "0", "0", "0"]

[[kinds]]
name = "angular_frequency"
type = "named"
dimensions = ["0", "0", "-1", "0", "0", "0", "0"]

[[kinds]]
name = "duration"
type = "named"
dimensions = ["0", "0", "1", "0", "0", "0", "0"]

[[kinds]]
name = "length"

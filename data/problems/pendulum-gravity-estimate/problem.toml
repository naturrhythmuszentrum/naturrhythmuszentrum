[[variants]]
name = "deterministic-instrument-and-reading-enclosures"
description = "replace the probabilistic declarations by separately assumed deterministic bounds on every relevant input"
overrides = { uncertainty_mode = "1" }
expected = "Use the eight _enclosed records in the same measurement equations. All lengths and periods stay positive throughout their enclosures. Each gravity estimate increases with its length and the shared ruler offset, and decreases with its measured period and the shared stopwatch rate. Therefore simultaneous endpoint choices attain the exact extrema of the unweighted mean.\nThe average independent length half-width is (0.0016+0.001+0.0008)/3=17/15000 m. Adding the shared ruler half-width gives 139/75000 m. Thus the upper and lower mean length numerators are 74659/75000 m and 74381/75000 m. The measured period endpoints are 4967/2484 s and 4969/2484 s, and the shared rate factors are 2069/2070 and 2071/2070.\nThe exact mean enclosure is [g_lower,g_upper], where g_lower=4*pi^2*(74381/75000)*(2484/4969)^2*(2070/2071)^2 and g_upper=4*pi^2*(74659/75000)*(2484/4967)^2*(2070/2069)^2, both in m/s^2. A radius about the nominal mean g0=(621/625)*pi^2 is max(g0-g_lower,g_upper-g0). These nonlinear endpoint expressions include interaction effects and provide a worst-case bound under the declared enclosure assumptions.\nThe half-widths are independent deterministic declarations, even where their magnitudes equal the standard uncertainties in the other mode. An enclosure supplies no variance. Conversely, the standard uncertainties alone do not provide this deterministic bound.\n"


closed_form = "(g1+g2+g3)/3"
value = "9.80643893292"
value_kind = "decimal-12"
derivation = "All three central estimates equal (621/625)*pi^2, so their unweighted mean has the same value. It differs from the exact comparison acceleration by approximately -0.000211067077614 m/s^2.\n"
second_route = "none"
descriptor = { dimensions = ["1", "0", "-2", "0", "0", "0", "0"], kind = "acceleration", measure = { display = "m/s^2", scale = "1", offset = "0" }, affine_role = "difference" }

[[observables]]
name = "g1"
description = "first nominal gravity estimate"
closed_form = "4*pi^2*l1/t1^2"
value = "9.80643893292"
value_kind = "decimal-12"
derivation = "At zero nominal calibration offsets, g1=4*pi^2*(621/625)/4=(621/625)*pi^2. Using pi=16*atan(1/5)-4*atan(1/239), with alternating-series remainder bounds, gives pi^2=9.869604401089358... and g1=9.806438932922386... m/s^2.\n"
second_route = "none"
descriptor = { dimensions = ["1", "0", "-2", "0", "0", "0", "0"], kind = "acceleration", measure = { display = "m/s^2", scale = "1", offset = "0" }, affine_role = "difference" }
expression = { kind = "algebra", text = "4*pi^2*l1/t1^2" }


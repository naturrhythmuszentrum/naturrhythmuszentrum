value_kind = "decimal-12"
derivation = "The second nominal length and period equal the first, so g2=(621/625)*pi^2 m/s^2. Its independent reading uncertainty differs, but that does not change its central value.\n"
second_route = "none"
descriptor = { dimensions = ["1", "0", "-2", "0", "0", "0", "0"], kind = "acceleration", measure = { display = "m/s^2", scale = "1", offset = "0" }, affine_role = "difference" }

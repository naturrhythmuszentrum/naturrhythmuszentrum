[problem]
slug = "pendulum-gravity-estimate"
title = "Gravitational acceleration from pendulum periods"
register = "prob:exemplars:pendulum-gravity-estimate"
kind = "problem"
model = "The small-angle simple-pendulum model gives g_i=4*pi^2*L_i/T_i^2. The measurement equations are L_i=l_i+ruler_offset and T_i=t_i*(1+stopwatch_rate). Each measured l_i and t_i has its own independent standard uncertainty. The common ruler offset and stopwatch rate are shared random inputs, independent of one another and of the six independent readings. First-order propagation retains their induced cross-covariances.\nUncertainty mode zero uses the standard-uncertainty records. Mode one instead uses the corresponding records ending in _enclosed. Each pair describes alternative declarations of the same measurement or instrument source and is never composed as two inputs. The enclosure records impose additional deterministic assumptions; their half-widths are not confidence limits inferred from the standard uncertainties and supply no variances.\n"
instance = "Three nominally identical pendulums each have measured length 621/625 m and period 2 s. They have different independent length-reading uncertainties and identical independent timing uncertainties. Their shared ruler offset and stopwatch rate have nominal value zero. The exact defined standard acceleration 9.80665 m/s^2 is supplied only for comparison.\n"


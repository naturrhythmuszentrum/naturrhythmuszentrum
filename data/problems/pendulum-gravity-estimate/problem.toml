[[observables]]
name = "mean_standard_uncertainty_correlated"
description = "probabilistic-only first-order standard uncertainty retaining shared sources"
closed_form = "7*pi^2/5000"
value = "0.0138174461615"
value_kind = "decimal-12"
derivation = "At the nominal inputs, each length derivative is pi^2, each period derivative is -(621/625)*pi^2 per second, the shared ruler derivative is pi^2, and the shared rate derivative is -2*(621/625)*pi^2. Use w=pi^2/25000 m/s^2 as a common propagated scale. The independent length contributions are 40*w,25*w,20*w; the three independent timing contributions have magnitude 10*w each. The shared ruler contribution is 18*w to every estimate, and the shared stopwatch contribution is -24*w to every estimate.\nConsequently Cov(g_i,g_j)=900*w^2 for i!=j, and the diagonal entries are 2600*w^2,1625*w^2,1400*w^2. Equivalently, the full covariance matrix is w^2*[[2600,900,900],[900,1625,900],[900,900,1400]]. The variance of the mean is (2600+1625+1400+6*900)*w^2/9=1225*w^2. Its standard uncertainty is 35*w=7*pi^2/5000=0.0138174461615251... m/s^2. The covariance formula is a linear probabilistic estimate, not a deterministic certificate.\n"
second_route = "Group contributions by independent source before forming output covariances. The six individual contributions give mean variance (40^2+25^2+20^2+3*10^2)*w^2/9=325*w^2. The two shared contributions give (18^2+24^2)*w^2=900*w^2. Their sum is again 1225*w^2."
descriptor = { dimensions = ["1", "0", "-2", "0", "0", "0", "0"], kind = "standard_acceleration", measure = { display = "m/s^2", scale = "1", offset = "0" }, affine_role = "difference" }
companion = { class = "measurement", mode = "standard", target = "mean_gravity", source = "observables.mean_standard_uncertainty_correlated.derivation", assurance = "Unverified first-order probabilistic comparison; not a deterministic bound" }
expression = { kind = "unsupported", text = "7*pi^2/5000", code = "omitted-propagation-scale-and-contributors", reason = "The specialized coefficient omits the acceleration scale w and executable sensitivity/source contributions. A check requires dimensioned propagation and all bound length, timing, shared ruler and stopwatch contributors; the nominal mean expression does not bind the calibration contributions.", dependencies = ["pi", "mean_gravity", "sigma_l1", "sigma_l2", "sigma_l3", "sigma_t1", "sigma_t2", "sigma_t3", "sigma_ruler_offset", "sigma_stopwatch_rate"], scope = ["expression"] }

[[observables]]
name = "mean_standard_uncertainty_independence_assumed"
description = "incorrect comparison obtained by dropping cross-covariances while retaining marginal variances"
closed_form = "pi^2/1000"
value = "0.00986960440109"
value_kind = "decimal-12"
derivation = "Treating the three estimates as independent drops the six off-diagonal covariance terms. The resulting mean variance is (2600+1625+1400)*w^2/9=625*w^2, so its standard uncertainty is 25*w=pi^2/1000. This is a comparison calculation that contradicts the declared shared sources.\n"
second_route = "none"
descriptor = { dimensions = ["1", "0", "-2", "0", "0", "0", "0"], kind = "standard_acceleration", measure = { display = "m/s^2", scale = "1", offset = "0" }, affine_role = "difference" }
companion = { class = "measurement", mode = "standard", target = "mean_gravity", source = "observables.mean_standard_uncertainty_independence_assumed.derivation", assurance = "Unverified first-order probabilistic comparison; not a deterministic bound" }
expression = { kind = "unsupported", text = "pi^2/1000", code = "omitted-propagation-scale-and-contributors", reason = "The specialized coefficient omits the acceleration scale w and executable sensitivity/source contributions. A check requires dimensioned propagation and all bound length, timing, shared ruler and stopwatch contributors; the nominal mean expression does not bind the calibration contributions. This preserved comparison also assumes independence contrary to the declared shared sources.", dependencies = ["pi", "mean_gravity", "sigma_l1", "sigma_l2", "sigma_l3", "sigma_t1", "sigma_t2", "sigma_t3", "sigma_ruler_offset", "sigma_stopwatch_rate"], scope = ["expression"] }


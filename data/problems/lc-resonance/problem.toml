[problem]
slug = "lc-resonance"
title = "LC resonance"
register = "prob:exemplars:lc-resonance"
kind = "problem"
model = "An ideal lossless inductor and capacitor form a series LC one-port. With passive voltage/current signs and the phasor convention Re(V_hat*exp(i*omega*t/radian)), Z=i*X and X=(omega/radian)*L-1/((omega/radian)*C). The current charges the capacitor: C*dv/dt=i and L*di/dt=-v when the source is removed. Thus x=(v,i) has the mixed-kind state operator A=[[0,1/C],[-1/L,0]], mapping voltage/current to their time derivatives; its coherent-coordinate array is [[0,100000],[-40,0]]. The characteristic polynomial is s^2+1/(L*C), with a Complex rate s and Real positive L,C. These equations describe an ideal model; an uncertainty declaration of none does not certify physical exactness.\nThe exact reference coordinates are L=25/1000=1/40 H and C=10/1000000=1/100000 F. Therefore L*C=1/4000000 s^2, sqrt(L*C)=1/2000 s, omega0=2000 rad/s, f0=1000/pi Hz, T=pi/1000 s, and sqrt(L/C)=sqrt(2500)=50 ohm. The frequency kind counts periods per second; the angular-frequency kind accumulates angle per second. The explicit one-second and one-hertz constants implement f0=(1 s/T)*(1 Hz); no conversion of unlike kinds is inferred from their identical dimensions. The expression 8*atan(1) denotes the full-cycle angle 2*pi rad without an irrational measure scale.\nAt omega=1000,2000,4000 rad/s, the inductor and capacitor reactances in ohms are respectively (25,100), (50,50), (100,25), so Z is -75*i, 0, +75*i ohm. Every real component is zero. Below and above resonance the principal impedance phase arg(V_hat)-arg(I_hat) is -pi/2 and +pi/2 rad, respectively -90 and +90 degrees. Phase is an angle difference, defined modulo a full turn; the displayed branch lies in (-pi,pi]. At exact resonance Z=0, its phase is undefined, and the series admittance 1/Z has a pole; neither infinity nor a zero phase is a finite expected value. Away from resonance Y is +i/75 and -i/75 S. A nonzero ideal voltage drive at resonance has no bounded sinusoidal steady-state current, so no such amplitude is asserted.\nThe eigenvalues are s_plus=+2000*i and s_minus=-2000*i s^(-1), both with zero real component. Their product is 4000000 s^(-2), their sum is zero, and (s-2000*i)*(s+2000*i)=s^2+4000000. These are rate-valued eigenvalues, not hertz; multiplying their imaginary magnitudes by one radian gives omega0. Initial v=5 V and i=0 A give E=(C*v^2+L*i^2)/2=1/8000 J. The independent trajectory v=5*cos(2000*t/(1 s)) V and i=-(1/10)*sin(2000*t/(1 s)) A satisfies both differential equations and preserves E by cos^2+sin^2=1; equivalently dE/dt=C*v*dv/dt+L*i*di/dt=v*i-i*v=0.\nAll reference values follow from the displayed hand arithmetic, independent of engine evaluation. For the irrational values use Machin's identity pi=16*atan(1/5)-4*atan(1/239), proved by the tangent addition formula and the first-quadrant branch. Alternating sums through j=15 and j=5 in atan(x)=sum((-1)^j*x^(2*j+1)/(2*j+1)), with their signed next-term remainders, give 3.141592653589793<pi<3.141592653589794. Rational scaling and reciprocal endpoint reversal then give 318.309886183790<f0/(1 Hz)<318.309886183791, 0.003141592653589793<T/(1 s)<0.003141592653589794, and 1.5707963267948965<abs(phase)/(1 rad)<1.570796326794897. These enclosures justify the twelve-significant-digit values; decimal-12 denotes rounding, not an exact value or an engine-certified enclosure. Exact formulas remain in closed_form and derivation.\nSchema v2 has rational scalar value fields and Real-only algebra declarations. Complex phasors are therefore represented by named scalar real/reactive components, and eigenvalues by named scalar real/imaginary components with their pairing fixed by the names. The four spectral component expressions and two nonzero phase expressions are explicitly unsupported. An unsupported equation records the undefined resonance phase without inventing a numeric observable. Degrees appear only in documentary text in this rational-field corpus. The typed bindings API admits the exact degree scale pi/180 and turn scale 2*pi; numerical conversion whose required coefficient remains irrational returns UnsupportedExactConstantExport until a certified constant enclosure is available. Scalar descriptor checking does not certify a spectrum, a complex argument, a trigonometric value or the physical model.\n"
instance = "L=25 mH, C=10 microfarad; impedance samples at 1000 rad/s, the derived resonance, and 4000 rad/s. For the separate source-free energy check, initial capacitor voltage is 5 V and initial current is 0 A. The strictly positive L,C domain is a model assumption, not a consequence of nonzero flags.\n"


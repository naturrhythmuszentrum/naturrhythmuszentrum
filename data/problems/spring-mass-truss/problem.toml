[problem]
slug = "spring-mass-truss"
title = "Spring-mass truss statics"
register = "prob:exemplars:spring-mass-truss"
kind = "problem"
model = "Three axial springs support one free planar node. Linearisation fixes the member directions at their undeformed values. Positive member force denotes tension. The node mass does not enter static equilibrium; gravity is omitted from the prescribed loading. Geometric nonlinearity and material nonlinearity are outside the model.\n"
instance = "The free node is initially at (0,0). Fixed anchors are at (-L,0), (0,-L), and (-L,-L). The horizontal and vertical members each have length L; the diagonal member has length L*sqrt(2). Their independent axial stiffnesses are kx, ky, and kd. The applied nodal load is (Fx,Fy). The two free degrees of freedom are ux and uy.\n"

[[kinds]]
name = "length"
type = "named"
dimensions = ["1", "0", "0", "0", "0", "0", "0"]

[[kinds]]
name = "mass"
type = "named"
dimensions = ["0", "1", "0", "0", "0", "0", "0"]

[[kinds]]
name = "stiffness"
type = "named"
dimensions = ["0", "1", "-2", "0", "0", "0", "0"]

[[kinds]]
name = "force"
type = "named"
dimensions = ["1", "1", "-2", "0", "0", "0", "0"]

[[kinds]]
name = "ratio"
type = "ratio"
dimensions = ["0", "0", "0", "0", "0", "0", "0"]

[[kinds]]
name = "stiffness_squared"
type = "named"
dimensions = ["0", "2", "-4", "0", "0", "0", "0"]

[[kinds]]
name = "force_stiffness"
type = "named"
dimensions = ["1", "2", "-4", "0", "0", "0", "0"]

[[kind_rules]]
operation = "multiply"
left = "stiffness"
right = "stiffness"
result = "stiffness_squared"
reason = "Products of stiffness coefficients form the static determinant."

[[kind_rules]]
operation = "power"
base = "stiffness"
exponent = "2"
result = "stiffness_squared"
reason = "Square the dynamic or static stiffness for the denominator or determinant."

[[kind_rules]]
operation = "multiply"
left = "stiffness"
right = "force"
result = "force_stiffness"
reason = "A stiffness coefficient times a force enters the elimination numerator."

[[kind_rules]]
operation = "divide"
left = "force_stiffness"
right = "stiffness_squared"
result = "length"
reason = "Divide the displacement numerator by the stiffness determinant."

[[kind_rules]]
operation = "multiply"
left = "stiffness"
right = "length"
result = "force"
reason = "Hooke stiffness times axial extension gives force."

[[parameters]]
name = "L"
description = "undeformed length of each orthogonal member"
value = "1"
uncertainty = { kind = "none" }
role = "quantity"
descriptor = { dimensions = ["1", "0", "0", "0", "0", "0", "0"], kind = "length", measure = { display = "m", scale = "1", offset = "0" }, affine_role = "difference" }
nonzero = false

[[parameters]]
name = "mass"
description = "mass attached to the free node"
value = "1"
uncertainty = { kind = "none" }
role = "quantity"
descriptor = { dimensions = ["0", "1", "0", "0", "0", "0", "0"], kind = "mass", measure = { display = "kg", scale = "1", offset = "0" }, affine_role = "difference" }
nonzero = false

[[parameters]]
name = "kx"
description = "horizontal member stiffness"
value = "1000"
uncertainty = { kind = "none" }
role = "quantity"
descriptor = { dimensions = ["0", "1", "-2", "0", "0", "0", "0"], kind = "stiffness", measure = { display = "N/m", scale = "1", offset = "0" }, affine_role = "difference" }
nonzero = false

[[parameters]]
name = "ky"
description = "vertical member stiffness"
value = "1"
uncertainty = { kind = "none" }

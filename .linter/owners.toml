# SPDX-License-Identifier: CC0-1.0
# Declares the repository owner over the root files, the declared surface and the documents; a package owner joins with its partition as the package lands.
namespace = "org.naturrhythmuszentrum.linter.owners"
version = [1, 0, 0]

owners = [
  "NRZ",
  "DOCGEN",
  "SCALAR",
  "MATRIX",
  "ALGEBRA",
  "UNITS",
  "DESCRIPTORS",
]

partitions = [
  { name = "declared-surface", owner = "NRZ", pattern = '%s".linter" [ "/" *VCHAR ]' },
  { name = "root-files", owner = "NRZ", pattern = '( %s".gitignore" / %s"CONTRIBUTING.md" / %s"templates/CONTRIBUTING.md.j2" / %s"Cargo.lock" / %s"Cargo.toml" / %s"LICENSE-CODE" / %s"LICENSE-DOCS" / %s"README.md" / %s"templates/README.md.j2" / %s"rust-toolchain.toml" )' },
  { name = "documents", owner = "NRZ", pattern = '[ %s"templates/" ] %s"docs" [ "/" *VCHAR ]' },
  { name = "data", owner = "NRZ", pattern = '%s"data" [ "/" *VCHAR ]' },
  { name = "problems", owner = "NRZ", pattern = '[ %s"templates/" ] %s"problems" [ "/" *VCHAR ]' },
  { name = "docgen", owner = "DOCGEN", pattern = '[ %s"templates/" ] %s"packages/docgen" [ "/" *VCHAR ]' },
  { name = "scalar", owner = "SCALAR", pattern = '[ %s"templates/" ] %s"packages/scalar" [ "/" *VCHAR ]' },
  { name = "matrix", owner = "MATRIX", pattern = '[ %s"templates/" ] %s"packages/matrix" [ "/" *VCHAR ]' },
  { name = "algebra", owner = "ALGEBRA", pattern = '[ %s"templates/" ] %s"packages/algebra" [ "/" *VCHAR ]' },
  { name = "units", owner = "UNITS", pattern = '[ %s"templates/" ] %s"packages/units" [ "/" *VCHAR ]' },
  { name = "descriptors", owner = "DESCRIPTORS", pattern = '[ %s"templates/" ] %s"packages/descriptor-prototype" [ "/" *VCHAR ]' },
]

may_cite = []

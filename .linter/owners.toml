# SPDX-License-Identifier: CC0-1.0
# Declares the repository owner over the root files, the declared surface and the documents; a package owner joins with its partition as the package lands.
namespace = "org.naturrhythmuszentrum.linter.owners"
version = [1, 0, 0]

owners = [
  "NRZ",
  "DOCGEN",
  "SCALAR",
  "ACCURACY",
  "MATRIX",
  "BINDINGS",
  "CAS",
  "ORCHESTRATION",
]

partitions = [
  { name = "declared-surface", owner = "NRZ", pattern = '%s".linter" [ "/" *VCHAR ]' },
  { name = "root-files", owner = "NRZ", pattern = '( %s".gitignore" / %s"CONTRIBUTING.md" / %s"templates/CONTRIBUTING.md.j2" / %s"Cargo.lock" / %s"Cargo.toml" / %s"LICENSE-CODE" / %s"LICENSE-DOCS" / %s"README.md" / %s"templates/README.md.j2" / %s"rust-toolchain.toml" )' },
  { name = "documents", owner = "NRZ", pattern = '[ %s"templates/" ] %s"docs" [ "/" *VCHAR ]' },
  { name = "data", owner = "NRZ", pattern = '%s"data" [ "/" *VCHAR ]' },
  { name = "docgen", owner = "DOCGEN", pattern = '[ %s"templates/" ] %s"tools/docgen" [ "/" *VCHAR ]' },
  { name = "scalar", owner = "SCALAR", pattern = '[ %s"templates/" ] %s"crates/scalar" [ "/" *VCHAR ]' },
  { name = "accuracy", owner = "ACCURACY", pattern = '[ %s"templates/" ] %s"crates/accuracy" [ "/" *VCHAR ]' },
  { name = "matrix", owner = "MATRIX", pattern = '[ %s"templates/" ] %s"crates/matrix" [ "/" *VCHAR ]' },
  { name = "bindings", owner = "BINDINGS", pattern = '[ %s"templates/" ] %s"crates/bindings" [ "/" *VCHAR ]' },
  { name = "cas", owner = "CAS", pattern = '[ %s"templates/" ] %s"crates/cas" [ "/" *VCHAR ]' },
]

imports = [
  { owner = "ORCHESTRATION", registry = ".linter/imports/orchestration.toml" },
]

may_cite = [
  { owner = "NRZ", target = "ORCHESTRATION" },
  { owner = "DOCGEN", target = "ORCHESTRATION" },
  { owner = "SCALAR", target = "ORCHESTRATION" },
  { owner = "ACCURACY", target = "ORCHESTRATION" },
  { owner = "MATRIX", target = "ORCHESTRATION" },
  { owner = "BINDINGS", target = "ORCHESTRATION" },
  { owner = "CAS", target = "ORCHESTRATION" },
  { owner = "NRZ", target = "DOCGEN" },
  { owner = "NRZ", target = "SCALAR" },
  { owner = "NRZ", target = "ACCURACY" },
  { owner = "NRZ", target = "MATRIX" },
  { owner = "NRZ", target = "BINDINGS" },
  { owner = "NRZ", target = "CAS" },
  { owner = "ACCURACY", target = "SCALAR" },
  { owner = "BINDINGS", target = "CAS" },
  { owner = "DOCGEN", target = "BINDINGS" },
  { owner = "DOCGEN", target = "CAS" },
  { owner = "MATRIX", target = "ACCURACY" },
  { owner = "MATRIX", target = "BINDINGS" },
  { owner = "MATRIX", target = "SCALAR" },
]

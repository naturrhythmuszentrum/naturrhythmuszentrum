# Declares the repository owner over the root files, the declared surface and the documents; a package owner joins with its partition as the package lands.
namespace = "org.naturrhythmuszentrum.linter.owners"
version = [1, 0, 0]

owners = [
  "NRZ",
  "DOCGEN",
  "SCALAR",
]

partitions = [
  { name = "declared-surface", owner = "NRZ", pattern = '%s".linter" [ "/" *VCHAR ]' },
  { name = "root-files", owner = "NRZ", pattern = '( %s".gitignore" / %s"CONTRIBUTING.md" / %s"CONTRIBUTING.md.j2" / %s"Cargo.lock" / %s"Cargo.toml" / %s"LICENSE-CODE" / %s"LICENSE-DOCS" / %s"README.md" / %s"README.md.j2" / %s"rust-toolchain.toml" )' },
  { name = "documents", owner = "NRZ", pattern = '%s"docs" [ "/" *VCHAR ]' },
  { name = "problems", owner = "NRZ", pattern = '%s"problems" [ "/" *VCHAR ]' },
  { name = "docgen", owner = "DOCGEN", pattern = '%s"packages/docgen" [ "/" *VCHAR ]' },
  { name = "scalar", owner = "SCALAR", pattern = '%s"packages/scalar" [ "/" *VCHAR ]' },
]

may_cite = []
